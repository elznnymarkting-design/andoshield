.founderCard::before{content:"";position:absolute;top:-40px;right:-40px;width:140px;height:140px;background:radial-gradient(circle,rgba(14,159,148,.25),transparent 70%);border-radius:50%;filter:blur(24px)}

html,body{
  overflow-x:hidden;
  width:100%;
  max-width:100vw;
  -webkit-text-size-adjust:100%;
}
.wrap{
  max-width:100%;
  width:100%;
  box-sizing:border-box;
}
img,svg,video,canvas{
  max-width:100%;
  height:auto;
  display:block;
}
table{
  width:100%;
  max-width:100%;
  table-layout:auto;
  word-break:break-word;
  overflow-wrap:break-word;
}
td,th{
  word-break:break-word;
  overflow-wrap:break-word;
  hyphens:auto;
}
pre,code{
  white-space:pre-wrap;
  word-wrap:break-word;
  overflow-wrap:break-word;
  max-width:100%;
}
.hh,.text-5xl,.text-4xl{
  word-break:break-word;
  hyphens:auto;
}

/* Tabs: horizontal scroll (intended) — but styled properly */
.tabs{
  overflow-x:auto;
  overflow-y:hidden;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
  scroll-snap-type:x proximity;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:0 0 auto;
  min-width:max-content;
  scroll-snap-align:start;
}

/* Containers: no fixed widths */
.box,.navbar,.hero,.cta,.tierbox,.alertbox,.founderCard,.bundleCard{
  max-width:100%;
  box-sizing:border-box;
}

/* QR covers and images */
.qr-cover{max-width:100%}
.qr-cover img{max-width:100%;height:auto}

/* Navbar: stack on tiny screens */
@media(max-width:400px){
  .navbar{
    flex-direction:column;
    gap:.5rem;
  }
  .navbar button{width:100%}
}

/* Small phones: tighten spacing */
@media(max-width:480px){
  .wrap{padding-left:.75rem;padding-right:.75rem}
  .px-4{padding-left:.75rem;padding-right:.75rem}
  .text-3xl{font-size:1.5rem}
  .hh{font-size:1.6rem!important}
  .btn{padding:.6rem 1rem;font-size:.85rem}
  .tab{font-size:.62rem;padding:.4rem .5rem}
}

/* Tables on mobile: allow scroll inside container */
.overflow-x-auto{
  -webkit-overflow-scrolling:touch;
  max-width:100%;
}

/* Prevent long URLs / emails from breaking layout */
a[href^="http"],a[href^="mailto"]{
  word-break:break-all;
  overflow-wrap:break-word;
}

/* Header: ensure buttons fit */
.hdr .flex{flex-wrap:wrap}
@media(max-width:520px){
  .hdr button{padding:.4rem .6rem;min-height:38px;font-size:.75rem}
  .hdr .leading-tight .text-xs{font-size:.6rem}
}

aboutWhyText:["1 in 6 couples struggles with infertility. In ~40% of cases, the male factor is the primary cause. ~50% of those are treatable — if caught early.","1 من كل 6 أزواج يعانون من العقم. في ~40% من الحالات، عامل الذكر هو السبب الرئيسي. ~50% منها قابل للعلاج إذا اكتُشف مبكراً."],

aboutHero:["The first private, verifiable, on-device male fertility triage platform","أول منصة فرز خاصة وقابلة للتحقق للخصوبة عند الرجل تعمل بالكامل على الجهاز"],
aboutTagline:["Privacy is not a feature. It is the architecture.","الخصوصية ليست ميزة. إنها المعمارية."],
aboutValuesT:["What makes AndroShield different","ما يجعل أندروشيلد مختلفاً"],
aboutValues:[
["🔒 Privacy by Architecture","الخصوصية بالمعمارية","Zero network requests. Zero server storage. Every computation happens on your device. Verifiable in DevTools.","صفر طلبات شبكية. صفر تخزين على خادم. كل الحسابات تحدث على جهازك. قابلة للتحقق في DevTools."],
["🔬 Explainable AI","ذكاء اصطناعي قابل للتفسير","Every score shows the exact factors that contributed. Not a black box. Every weight is traceable to published literature.","كل نتيجة تعرض العوامل التي ساهمت بالضبط. ليست صندوقاً أسود. كل وزن يمكن تتبعه إلى الأدبيات المنشورة."],
["👨‍⚕️ Human-in-the-Loop","الإنسان في الحلقة","Every Tier 3–5 referral is reviewed by a clinician before it is final. The AI recommends; the clinician decides.","كل إحالة من المستوى ٣–٥ يراجعها طبيب قبل اعتمادها. الذكاء الاصطناعي يوصي؛ الطبيب يقرر."],
["📜 Verifiable Decisions","قرارات قابلة للتحقق","Every action is SHA-256 hashed with the previous entry. Tampering with any entry breaks the chain.","كل إجراء موقّع بـ SHA-256 مع السجل السابق. أي تلاعب يكسر السلسلة."],
["🌍 Culturally Aware","واعٍ ثقافياً","Arabic-first, gender-sensitive, discreet messaging. Built for the Gulf, ready for the world.","عربي أولاً، حساس للجنس، رسائل محايدة. مبني للخليج، جاهز للعالم."],
["⚡ Clinically Grounded","مبني على الأدلة","WHO 2021 6th Edition. ASRM 2020. Esteves 2019. Every threshold is sourced, not invented.","WHO 2021 الطبعة السادسة. ASRM 2020. Esteves 2019. كل عتبة موثقة، ليست مُختلقة."]
],

aboutContactText:["For clinical partnerships, regulatory inquiries, or pilot collaboration in Abu Dhabi — reach out to our team.","للشراكات السريرية، أو الاستفسارات التنظيمية، أو التعاون في التجربة بأبوظبي — تواصل مع فريقنا."],

aboutFounderName:["Ehab Heshmat Fouad Tawadros","إيهاب حشمت فؤاد تاوضروس"],
aboutFounderRole:["Founder & Clinical Content Reviewer — Pharmacist","المؤسس ومراجع المحتوى السريري — صيدلي"],
aboutFounderCred:["B.Pharm · 16 years community pharmacy · Clinical Nutrition · Therapeutic Compounding","بكالوريوس صيدلة · ١٦ عاماً في الصيدليات العامة · تغذية علاجية · تركيبات علاجية"],
aboutFounderBio:["Ehab is a pharmacist, not a physician. Over 16 years on the front line of community pharmacy, he has counselled men on medications, supplements, and lifestyle factors that affect reproductive health — often before they ever see a specialist. He designed AndroShield to bridge that gap: a private, on-device first step that routes men to the right clinician, without ever diagnosing. He led the clinical content review, including all medication-related items, WHO 2021 threshold verification, and the Arabic patient-facing wording.","إيهاب صيدلي، وليس طبيباً. على مدى ١٦ عاماً في الصيدليات العامة، قدّم المشورة للرجال حول الأدوية والمكملات وعوامل نمط الحياة التي تؤثر على الصحة الإنجابية — غالباً قبل أن يروا أخصائياً. صمّم أندروشيلد لسدّ هذه الفجوة: خطوة أولى خاصة على الجهاز تُوجّه الرجل إلى الطبيب المناسب، دون تشخيص أبداً. قاد مراجعة المحتوى السريري، بما يشمل جميع البنود الدوائية، والتحقق من عتبات WHO 2021، والصياغة العربية الموجهة للمريض."],
